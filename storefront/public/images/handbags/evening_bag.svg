<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#F8F6F4"/>
  <defs>
    <linearGradient id="eveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2B30"/>
      <stop offset="100%" stop-color="#151417"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE8A6"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#A17B16"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <circle cx="300" cy="300" r="220" fill="#EDE9E3" opacity="0.6"/>
  <!-- Fine Chain Drop -->
  <path d="M 230 270 Q 300 160 370 270" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="6 4"/>
  <!-- Clutch Box Body -->
  <rect x="180" y="270" width="240" height="150" rx="16" fill="url(#eveGrad)" filter="url(#shadow)"/>
  <!-- Gold Metallic Rim -->
  <rect x="180" y="270" width="240" height="150" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <!-- Gold Crystal Clasp -->
  <polygon points="300,250 315,270 285,270" fill="url(#goldGrad)"/>
  <circle cx="300" cy="256" r="8" fill="#FFF8E7"/>
  <text x="300" y="490" text-anchor="middle" font-family="'Cinzel', serif" font-size="18" font-weight="600" fill="#2D2B30" letter-spacing="4">LUXURY EVENING CLUTCH</text>
</svg>
