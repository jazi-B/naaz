<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#FAF6F4"/>
  <defs>
    <linearGradient id="miniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F9E8B"/>
      <stop offset="100%" stop-color="#647360"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D068"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#2D3B29" flood-opacity="0.18"/>
    </filter>
  </defs>
  <circle cx="300" cy="300" r="220" fill="#ECE8E3" opacity="0.6"/>
  <!-- Rigid Top Handle -->
  <path d="M 240 280 A 60 60 0 0 1 360 280" fill="none" stroke="#465442" stroke-width="12" stroke-linecap="round"/>
  <!-- Compact Body -->
  <rect x="200" y="270" width="200" height="150" rx="20" fill="url(#miniGrad)" filter="url(#shadow)"/>
  <!-- Envelope Flap -->
  <polygon points="200,270 400,270 300,340" fill="#586754"/>
  <!-- Round Metal Buckle -->
  <circle cx="300" cy="340" r="12" fill="url(#goldGrad)"/>
  <text x="300" y="490" text-anchor="middle" font-family="'Cinzel', serif" font-size="18" font-weight="600" fill="#465442" letter-spacing="4">PETITE MINI BAG</text>
</svg>
