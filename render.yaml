services:
  - type: web
    name: naaz-medusa-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && cd backend/medusa-app && npm install && npm run build
    startCommand: cd backend/medusa-app/apps/backend && npx @medusajs/cli db:migrate && npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: naaz-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: AUTH_MFA_ENCRYPTION_KEY
        generateValue: true
      - key: STORE_CORS
        value: "*"
      - key: ADMIN_CORS
        value: "*"
      - key: AUTH_CORS
        value: "*"
      - key: MEDUSA_ADMIN_ONBOARDING_TYPE
        value: default

databases:
  - name: naaz-postgres
    databaseName: medusa_naaz
    user: medusa_user
    plan: free
    region: frankfurt
